# Memora Android CI
#
# Build and verify the app on every push/PR:
#   1. Build & unit tests  — assembles the debug APK and runs JVM unit tests.
#   2. Instrumented tests  — boots an Android emulator and runs the UI tests.
#
# The app itself is offline and permission-free; only the build toolchain
# needs network access (Gradle + Google Maven + Android SDK).
#
# Notes:
# - The SDK step is self-sufficient: it uses the runner's preinstalled Android
#   SDK and falls back to downloading Google's cmdline-tools if absent.
# - Steps emit ::notice:: diagnostics so failures are visible in annotations.

name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMGR=""
          for c in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            echo "::notice::No preinstalled sdkmanager — downloading Google cmdline-tools"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKMGR="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          fi
          echo "::notice::Using sdkmanager at $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          echo "::notice::SDK packages ready (platform 35, build-tools 34.0.0)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile instrumented tests
        run: |
          if ! ./gradlew :app:assembleDebugAndroidTest --stacktrace > compile-androidtest.log 2>&1; then
            echo "::error::androidTest compilation failed"
            grep -E "^e: |Could not find|Could not resolve|Execution failed|What went wrong" compile-androidtest.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "::notice::Instrumented test sources compiled OK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: memora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMGR=""
          for c in "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            echo "::notice::No preinstalled sdkmanager — downloading Google cmdline-tools"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDKMGR="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          fi
          echo "::notice::Using sdkmanager at $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          echo "::notice::SDK packages ready (platform 35, build-tools 34.0.0)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          # NOTE: the action splits this input by newlines and runs each line
          # as an independent sh -c command. Keep one command per line and
          # only single-line shell constructs here.
          script: |
            echo "::notice::Phase 1: compile instrumented tests"
            ./gradlew :app:assembleDebugAndroidTest --stacktrace > compile-androidtest.log 2>&1 || { echo "::error::androidTest compilation failed"; grep -E "^e: |Could not find|Could not resolve|What went wrong" compile-androidtest.log | head -8 | sed "s/^/::error::/"; exit 1; }
            echo "::notice::Phase 2: run connectedDebugAndroidTest"
            adb devices
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > connected-test.log 2>&1 || { echo "::error::connectedDebugAndroidTest failed"; grep -E "FAILED|AssertionError|Exception|No connected devices" connected-test.log | head -8 | sed "s/^/::error::/"; exit 1; }
            echo "::notice::All instrumented tests passed"

      - name: Extract instrumented test diagnostics
        if: failure()
        run: |
          echo "::notice::Diagnostics from instrumented run"
          if [ ! -d app/build/outputs/androidTest-results ]; then
            echo "::notice::No androidTest-results directory — tests likely did not start"
          fi
          find app/build/outputs/androidTest-results -name "*.xml" 2>/dev/null | while IFS= read -r f; do
            grep -o 'message="[^"]*"' "$f" | head -8 | while IFS= read -r m; do echo "::error::test $m"; done
          done
          grep -E "FAILED|AssertionError|No connected devices|Exception" connected-test.log 2>/dev/null | head -8 | while IFS= read -r l; do echo "::error::$l"; done
          true

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
